
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Recipe Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">🍲 My Recipe Book</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="catalog.html">Catalog</a>
        <a href="registration.html">Registration</a>
    </nav>
</header>

<main class="form-page">
    <form class="form-card" id="loginForm">
        <h1>Welcome Back! 👋</h1>
        <p>Login to explore delicious recipes.</p>

        <label>Email Address</label>
        <input type="email" id="loginEmail"
               placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="loginPassword"
               placeholder="Enter your password" required>

        <label class="check-line">
            <input type="checkbox" id="showPassword">
            Show Password
        </label>

        <button type="submit" class="btn full-btn">Login</button>

        <p class="form-bottom">
            Don't have an account?
            <a href="registration.html">Register Here</a>
        </p>
    </form>
</main>

<footer>
    <h3>My Recipe Book – Cook With Love</h3>
    <p>Contact: hello@myrecipebook.com</p>
</footer>

<script src="script.js"></script>
</body>
</html>
