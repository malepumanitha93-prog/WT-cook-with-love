
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - My Recipe Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">🍲 My Recipe Book</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="catalog.html">Catalog</a>
        <a href="registration.html">Registration</a>
    </nav>
</header>

<main class="form-page">
    <form class="form-card" id="registrationForm">
        <h1>Create Account 🧑‍🍳</h1>
        <p>Join our recipe-loving family!</p>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="tel" pattern="[0-9]{10}"
               placeholder="10-digit phone number" required>

        <label>Password</label>
        <input type="password" id="regPassword"
               minlength="6" placeholder="Create password" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword"
               placeholder="Confirm password" required>

        <label>Gender</label>
        <select required>
            <option value="">Select Gender</option>
            <option>Female</option>
            <option>Male</option>
            <option>Other</option>
            <option>Prefer not to say</option>
        </select>

        <button type="submit" class="btn full-btn">
            Create Account
        </button>

        <p class="form-bottom">
            Already have an account?
            <a href="login.html">Login Here</a>
        </p>
    </form>
</main>

<footer>
    <h3>My Recipe Book – Cook With Love</h3>
    <p>Contact: hello@myrecipebook.com</p>
</footer>

<script src="script.js"></script>
</body>
</html>
